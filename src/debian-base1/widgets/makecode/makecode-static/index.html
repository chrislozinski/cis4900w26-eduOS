<style id="edu-custom">
  /* Hide all login and cloud account buttons */
  .ui.item.sign-in,
  .signin-button,
  .cloud-save-btn,
  .profile-button,
  [data-store="github"],
  .githubsignin,
  .menuitem.cloudprovider {
    display: none !important;
  }

  /* Hide cloud status indicators */
  .cloudstatusarea,
  .cloud-status,
  .ui.cloudnotification {
    display: none !important;
  }
  /* keep sim, just restyle the panel */
  .simPanel { background-color: #1e1e2e !important; }

  /* Toolbar accent color */
  .menubar .ui.menu,
  .ui.inverted.menu {
    background-color: #3d2b4a !important;
  }

  /* Home page hero background */
  .ui.segment.mainbanner {
    background: linear-gradient(135deg, #3d2b4a 0%, #6B4F76 100%) !important;
  }
</style>

    <script type="text/javascript">
    if(/[&?]translate=1/.test(window.location.href)) {
		var _jipt = [];
        _jipt.push(['project', 'makecode']);
        _jipt.push(['escape', function() {
            window.location.href = window.location.href.replace(/[$\?]translate=1/, '');
        }]);
        _jipt.push(['before_dom_insert', function(text, node, attribute) {
            if (text)
                text = text.replace(/^\{(id|loc):[^\}]+\}/g, '');
            return text;
        }]);
        // inject crowdin
        (function _() {
            var s = document.createElement("script");
            s.setAttribute("type", "text/javascript");
            s.setAttribute("src", "//cdn.crowdin.com/jipt/jipt.js");
            document.head.insertBefore(s, document.head.firstElementChild);
        })();
    }
	</script>
