<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100%; height: 100vh; overflow: hidden; }
    #makecode-frame { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <iframe id="makecode-frame"></iframe>
  <script>
    var editorReady       = false;
    var pendingLoad       = null;
    var currentStepId     = null;
    var pendingSaveStepId = null;
    var currentLessonTitle = "Lesson Sandbox";

    document.getElementById("makecode-frame").src =
        window.location.origin + "/";

    // No origin filter — the offline MakeCode build may send pxthost with a
    // hardcoded targetOrigin of "https://arcade.makecode.com" which the browser
    // drops when the parent is on localhost.  In this sandboxed GTK WebView
    // there are no untrusted frames, so accepting all origins is safe.
    window.addEventListener("message", function(ev) {
      var msg = ev.data;
      if (!msg || !msg.type) return;

      if (msg.type === "pxthost") {
        if (!editorReady) {
          editorReady = true;
          // MakeCode is ready — flush any step that was queued before ready
          if (pendingLoad) {
            _sendImportProject(pendingLoad);
            pendingLoad = null;
          }
        }

        if (msg.action === "workspacesave" && msg.project) {
          var ts  = (msg.project.text && msg.project.text["main.ts"])     || "";
          var xml = (msg.project.text && msg.project.text["main.blocks"]) || "";
          var saveId = pendingSaveStepId || currentStepId;
          pendingSaveStepId = null;
          if (window.webkit && window.webkit.messageHandlers.workspaceSave) {
            window.webkit.messageHandlers.workspaceSave.postMessage({
              step_id:    saveId,
              raw_ts:     ts,
              cached_xml: xml
            });
          }
        }
      }
    });

    function loadStep(stepId, rawTs, cachedXml, lessonTitle) {
      currentStepId      = stepId;
      currentLessonTitle = lessonTitle || currentLessonTitle;
      var payload = { step_id: stepId, raw_ts: rawTs, cached_xml: cachedXml };
      if (!editorReady) {
        pendingLoad = payload;
        return;
      }
      _sendImportProject(payload);
    }

    function requestSave() {
      pendingSaveStepId = currentStepId;
      var iframe = document.getElementById("makecode-frame");
      iframe.contentWindow.postMessage({
        type:     "pxteditor",
        action:   "saveproject",
        id:       "save-" + Date.now(),
        response: false
      }, "*");
    }

    function _sendImportProject(payload) {
      var iframe  = document.getElementById("makecode-frame");
      var name    = currentLessonTitle || "Lesson Sandbox";
      var project = {
        editor: "blocksprj",
        text: {
          "main.ts":     payload.raw_ts  || "",
          "main.blocks": payload.cached_xml || "",
          "pxt.json":    JSON.stringify({
            name:         name,
            dependencies: { "device": "*" },
            description:  "",
            files:        ["main.blocks", "main.ts"]
          })
        },
        meta: {}
      };
      // Use "*" as targetOrigin — the offline build may use a different
      // origin than window.location.origin in its postMessage checks.
      iframe.contentWindow.postMessage({
        type:     "pxteditor",
        action:   "importproject",
        id:       "step-" + (payload.step_id || "blank") + "-" + Date.now(),
        response: false,
        project:  project
      }, "*");
    }
  </script>
</body>
</html>
